[project]
name = "course-creation-app"
version = "0.1.0"
description = "Course Creation Web App"
requires-python = ">=3.11"
dependencies = [
    "uvicorn>=0.54.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "httpx_sse>=0.4.3",
    "google-genai>=3.6.1",
    "google-cloud-logging>=3.17.1",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
