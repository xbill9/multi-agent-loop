[project]
name = "judge-builder-agent"
version = "0.1.0"
description = "Judge microservice agent"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.15.0",
    "a2a-sdk>=1.3.1",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "google-cloud-logging>=3.17.1",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
